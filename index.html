<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SCP-9221 — Навигация</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="lily-navigation">

    <!-- ДОКУМЕНТ -->

    <button
        class="lily-button"
        type="button"
        id="documentButton"
    >

        <span class="button-icon">✦</span>

        <span class="button-content">

            <span class="button-title">
                ДОКУМЕНТ
            </span>

            <span class="button-subtitle">
                ОСНОВНОЕ ДОСЬЕ
            </span>

        </span>

        <span class="button-arrow">
            →
        </span>

    </button>


    <!-- АРХИВ -->

    <button
        class="lily-button archive-button"
        type="button"
        id="archiveButton"
    >

        <span class="button-icon">
            ❈
        </span>

        <span class="button-content">

            <span class="button-title">
                АРХИВ
            </span>

            <span class="button-subtitle">
                ДОПОЛНИТЕЛЬНЫЕ МАТЕРИАЛЫ
            </span>

        </span>

        <span class="button-arrow">
            →
        </span>

    </button>

</div>

<script src="js/main.js"></script>

</body>
</html>
